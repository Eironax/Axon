name: Axon CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12 and sync dependencies
        run: uv sync --frozen

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Run unit tests
        run: uv run pytest -v

      - name: Validate Kubernetes manifests syntax
        run: uv run python -c "import pathlib, yaml; [list(yaml.safe_load_all(p.read_text())) for p in pathlib.Path('k8s').glob('*.yaml')]"

  validate-containers-and-k8s:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          tags: axon:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
