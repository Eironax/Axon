services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: axon-postgres
    environment:
      POSTGRES_USER: axon
      POSTGRES_PASSWORD: axon
      POSTGRES_DB: axon
    ports:
      - "5432:5432"
    volumes:
      - axon_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axon -d axon"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: axon-redis
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 300M

  prometheus:
    image: prom/prometheus:latest
    container_name: axon-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - axon_promdata:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 384M

  grafana:
    image: grafana/grafana:latest
    container_name: axon-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - axon_grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
      - postgres
    deploy:
      resources:
        limits:
          memory: 384M

  axon-api:
    build: .
    image: axon:latest
    container_name: axon-api
    profiles: ["gpu"]
    environment:
      AXON_POSTGRES_DSN: postgresql://axon:axon@postgres:5432/axon
      AXON_REDIS_URL: redis://redis:6379/0
      AXON_DEVICE: cuda
      AXON_TORCH_DTYPE: bfloat16
      HF_HOME: /home/axon/.cache/huggingface
    ports:
      - "8000:8000"
    volumes:
      - axon_hf_cache:/home/axon/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  axon_pgdata:
  axon_promdata:
  axon_grafanadata:
  axon_hf_cache:
