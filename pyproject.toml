[project]
name = "axon"
version = "0.1.0"
description = "Containerized LLM Latent Firewall & Activation Steering Engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "transformers",
    "accelerate",
    "safetensors",
    "numpy",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "psycopg[binary]",
    "pgvector",
    "redis",
    "prometheus-fastapi-instrumentator",
    "prometheus-client",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axon"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
