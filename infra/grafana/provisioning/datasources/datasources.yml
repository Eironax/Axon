apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Axon PostgreSQL
    uid: axon-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: axon
    secureJsonData:
      password: axon
    jsonData:
      database: axon
      sslmode: disable
      postgresVersion: 1700
    editable: true
