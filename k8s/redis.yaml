apiVersion: apps/v1
kind: Deployment
metadata:
  name: axon-redis
  namespace: axon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: axon-redis
  template:
    metadata:
      labels:
        app: axon-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "300Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: axon-redis
  namespace: axon
spec:
  selector:
    app: axon-redis
  ports:
    - port: 6379
      targetPort: 6379
